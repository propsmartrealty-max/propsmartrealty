<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="45%" stop-color="#1c2541"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glassTower" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="podiumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.8" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>
  <rect width="1200" height="800" fill="url(#sunGlow)"/>

  <!-- Stars / Ambient Sky Particles -->
  <g fill="#e0f2fe" opacity="0.6">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="280" cy="140" r="1.2"/>
    <circle cx="450" cy="70" r="1"/>
    <circle cx="780" cy="110" r="1.5"/>
    <circle cx="950" cy="85" r="1.2"/>
    <circle cx="1080" cy="130" r="1.8"/>
  </g>

  <!-- Distant Skyline Silhouettes -->
  <path d="M0,620 L60,610 L60,540 L110,540 L110,620 L190,620 L190,490 L240,490 L240,620 L320,620 L320,530 L380,530 L380,620 L860,620 L860,510 L920,510 L920,620 L1020,620 L1020,550 L1070,550 L1070,620 L1200,620 L1200,800 L0,800 Z" fill="#0f172a" opacity="0.7"/>

  <!-- Main Luxury High-Rise Architecture -->
  <!-- Left Wing -->
  <rect x="360" y="240" width="130" height="380" rx="4" fill="#1e293b"/>
  <line x1="360" y1="240" x2="490" y2="240" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

  <!-- Central Primary Tower (Glass & Steel Iconic Elevation) -->
  <rect x="510" y="140" width="180" height="480" rx="8" fill="url(#glassTower)"/>
  <rect x="525" y="160" width="150" height="440" rx="4" fill="#0c4a6e" opacity="0.5"/>

  <!-- Balcony Fins & Architectural Mullions -->
  <g stroke="#7dd3fc" stroke-width="1.5" opacity="0.4">
    <line x1="510" y1="180" x2="690" y2="180"/>
    <line x1="510" y1="220" x2="690" y2="220"/>
    <line x1="510" y1="260" x2="690" y2="260"/>
    <line x1="510" y1="300" x2="690" y2="300"/>
    <line x1="510" y1="340" x2="690" y2="340"/>
    <line x1="510" y1="380" x2="690" y2="380"/>
    <line x1="510" y1="420" x2="690" y2="420"/>
    <line x1="510" y1="460" x2="690" y2="460"/>
    <line x1="510" y1="500" x2="690" y2="500"/>
    <line x1="510" y1="540" x2="690" y2="540"/>
    <line x1="510" y1="580" x2="690" y2="580"/>
  </g>

  <!-- Illuminated Luxury Penthouse Units -->
  <g fill="url(#warmLight)">
    <rect x="535" y="170" width="24" height="8" rx="1"/>
    <rect x="575" y="170" width="24" height="8" rx="1"/>
    <rect x="635" y="170" width="24" height="8" rx="1"/>
    <rect x="535" y="210" width="24" height="8" rx="1"/>
    <rect x="635" y="210" width="24" height="8" rx="1"/>
    <rect x="575" y="250" width="24" height="8" rx="1"/>
    <rect x="535" y="290" width="24" height="8" rx="1"/>
    <rect x="635" y="290" width="24" height="8" rx="1"/>
    <rect x="575" y="330" width="24" height="8" rx="1"/>
    <rect x="535" y="370" width="24" height="8" rx="1"/>
    <rect x="635" y="410" width="24" height="8" rx="1"/>
    <rect x="575" y="450" width="24" height="8" rx="1"/>
    <rect x="535" y="490" width="24" height="8" rx="1"/>
    <rect x="635" y="530" width="24" height="8" rx="1"/>
  </g>

  <!-- Right Wing -->
  <rect x="710" y="220" width="130" height="400" rx="4" fill="#1e293b"/>
  <line x1="710" y1="220" x2="840" y2="220" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

  <!-- Left & Right Wing Windows -->
  <g fill="#38bdf8" opacity="0.35">
    <rect x="380" y="260" width="18" height="10" rx="1"/>
    <rect x="415" y="260" width="18" height="10" rx="1"/>
    <rect x="450" y="260" width="18" height="10" rx="1"/>
    <rect x="380" y="300" width="18" height="10" rx="1"/>
    <rect x="450" y="300" width="18" height="10" rx="1"/>
    <rect x="415" y="340" width="18" height="10" rx="1"/>
    <rect x="380" y="380" width="18" height="10" rx="1"/>
    <rect x="450" y="380" width="18" height="10" rx="1"/>
    <rect x="730" y="240" width="18" height="10" rx="1"/>
    <rect x="765" y="240" width="18" height="10" rx="1"/>
    <rect x="800" y="240" width="18" height="10" rx="1"/>
    <rect x="765" y="280" width="18" height="10" rx="1"/>
    <rect x="800" y="320" width="18" height="10" rx="1"/>
    <rect x="730" y="360" width="18" height="10" rx="1"/>
  </g>

  <!-- Landscaped Podium Base -->
  <rect x="260" y="590" width="680" height="110" rx="12" fill="url(#podiumGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Podium Accent Lighting -->
  <line x1="280" y1="620" x2="920" y2="620" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <!-- Foreground Landscape Deck & Tree Silhouettes -->
  <g fill="#0284c7" opacity="0.3">
    <circle cx="320" cy="590" r="18"/>
    <circle cx="345" cy="585" r="22"/>
    <circle cx="850" cy="585" r="22"/>
    <circle cx="875" cy="590" r="18"/>
  </g>

  <!-- Ground Gradient Floor -->
  <rect x="0" y="680" width="1200" height="120" fill="#090d16"/>

  <!-- Centered Official Brand Trust Badge -->
  <rect x="380" y="695" width="440" height="52" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.5))"/>
  <circle cx="410" cy="721" r="5" fill="#10b981"/>
  
  <text x="610" y="726" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    PROPSMART REALTY • DIRECT BUILDER MANDATE
  </text>
</svg>