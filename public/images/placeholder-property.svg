<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#2563eb"/>
      <stop offset="100%" stopColor="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  
  <!-- Subtle Architecture Grid -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Modern Architectural Silhouette -->
  <g transform="translate(150, 100)">
    <!-- Tower 1 -->
    <rect x="50" y="80" width="110" height="320" rx="6" fill="#334155" opacity="0.8"/>
    <!-- Tower 2 (Main) -->
    <rect x="180" y="20" width="140" height="380" rx="8" fill="#1e3a8a" opacity="0.9"/>
    <!-- Tower 3 -->
    <rect x="340" y="110" width="110" height="290" rx="6" fill="#334155" opacity="0.8"/>

    <!-- Light windows -->
    <g fill="#38bdf8" opacity="0.4">
      <rect x="200" y="50" width="20" height="12" rx="2"/>
      <rect x="235" y="50" width="20" height="12" rx="2"/>
      <rect x="270" y="50" width="20" height="12" rx="2"/>
      <rect x="200" y="80" width="20" height="12" rx="2"/>
      <rect x="235" y="80" width="20" height="12" rx="2"/>
      <rect x="270" y="80" width="20" height="12" rx="2"/>
      <rect x="200" y="110" width="20" height="12" rx="2"/>
      <rect x="235" y="110" width="20" height="12" rx="2"/>
      <rect x="270" y="110" width="20" height="12" rx="2"/>
      <rect x="70" y="120" width="18" height="10" rx="2"/>
      <rect x="100" y="120" width="18" height="10" rx="2"/>
      <rect x="360" y="140" width="18" height="10" rx="2"/>
      <rect x="390" y="140" width="18" height="10" rx="2"/>
    </g>

    <line x1="0" y1="400" x2="500" y2="400" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Clean Overlay Label -->
  <rect x="240" y="490" width="320" height="50" rx="25" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="522" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">
    PUNE PROPERTY VLOG • VERIFIED
  </text>
</svg>