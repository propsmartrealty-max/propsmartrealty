<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">
  <defs>
    <linearGradient id="panchshil-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA6D"/>
      <stop offset="50%" stop-color="#C89D4B"/>
      <stop offset="100%" stop-color="#9A7426"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Panchshil Iconic Interlocking Triangles Emblem -->
  <g transform="translate(24, 20)">
    <!-- Tower 1 -->
    <polygon points="20,12 36,68 4,68" fill="url(#panchshil-gold)"/>
    <!-- Tower 2 Interlocking -->
    <polygon points="38,4 54,68 22,68" fill="#1E293B" opacity="0.9"/>
    <!-- Accent Line -->
    <polygon points="48,22 62,68 34,68" fill="url(#panchshil-gold)" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="104" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="#1E293B" letter-spacing="2">PANCHSHIL</text>
  <text x="106" y="74" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#C89D4B" letter-spacing="4">LUXURY REAL ESTATE</text>
</svg>