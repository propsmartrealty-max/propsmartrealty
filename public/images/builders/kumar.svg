<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">
  <defs>
    <linearGradient id="kumar-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008752"/>
      <stop offset="100%" stop-color="#00633C"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Kumar Geometric 3-Tower Crest -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="url(#kumar-green)"/>
    <!-- Interlocking Residential Diamonds -->
    <polygon points="33,14 43,28 33,42 23,28" fill="#ffffff"/>
    <polygon points="21,28 31,42 21,54 11,42" fill="#ffffff" opacity="0.65"/>
    <polygon points="45,28 55,42 45,54 35,42" fill="#ffffff" opacity="0.65"/>
  </g>

  <!-- Typography -->
  <text x="106" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#008752" letter-spacing="1.5">KUMAR</text>
  <text x="107" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F2937" letter-spacing="3">PROPERTIES</text>
  <text x="107" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">Since 1966 • 35,000+ Happy Families in Pune</text>
</svg>
