  </g>

  <!-- Typography -->
  <text x="104" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#002D62" letter-spacing="1">NYATI</text>
  <text x="106" y="69" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#F58220" letter-spacing="3">GROUP</text>
  <text x="106" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">Creating Landmarks</text>
