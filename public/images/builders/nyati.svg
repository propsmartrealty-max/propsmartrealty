    <!-- 4 quadrant ribbons -->
    <path d="M 10 33 A 23 23 0 0 1 33 10 L 33 33 Z" fill="#F58220"/>
    <path d="M 33 10 A 23 23 0 0 1 56 33 L 33 33 Z" fill="#FFC20E"/>
