  <text x="107" y="72" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#AA771C" letter-spacing="3">BUILDING A BETTER LIFE</text>
  <text x="107" y="86" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.5">Macrotech Developers • India's #1</text>
