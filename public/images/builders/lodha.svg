      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7D3B"/>
    </linearGradient>
    <linearGradient id="lodha-maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1D2C"/>
      <stop offset="100%" stop-color="#6B1420"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Lodha Architectural Geometric Crest -->
  <g transform="translate(25, 22)">
