<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">
  <defs>
    <linearGradient id="amanora-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C2780"/>
      <stop offset="100%" stop-color="#7B1E6E"/>
    </linearGradient>
    <linearGradient id="amanora-sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB81C"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Amanora 400-Acre Smart City Sunburst Crest -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="url(#amanora-purple)"/>
    <!-- Radiating Solar Geometry -->
    <circle cx="33" cy="33" r="21" fill="none" stroke="url(#amanora-sun)" stroke-width="2.5"/>
    <path d="M 33 16 L 33 50 M 16 33 L 50 33 M 21 21 L 45 45 M 21 45 L 45 21" stroke="url(#amanora-sun)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="33" cy="33" r="7" fill="#ffffff"/>
    <circle cx="33" cy="33" r="4" fill="url(#amanora-purple)"/>
  </g>

  <!-- Typography -->
  <text x="106" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="29" font-weight="900" fill="#8E2888" letter-spacing="2">AMANORA</text>
  <text x="107" y="69" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155" letter-spacing="2.5">PARK TOWN • PUNE</text>
  <text x="107" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#8E2888" letter-spacing="1">400-Acre Masterplanned Mega Township</text>
</svg>
