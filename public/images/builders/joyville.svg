  <text x="107" y="87" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">Biophilic Living • Hinjewadi & Hadapsar</text>
