      <stop offset="0%" stop-color="#002B49"/>
      <stop offset="100%" stop-color="#00182B"/>
    </linearGradient>
    <linearGradient id="godrej-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
