  </g>

  <!-- Typography -->
  <text x="106" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#002B49" letter-spacing="-0.5">Godrej</text>
  <text x="107" y="71" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#AA771C" letter-spacing="4.5">PROPERTIES</text>
  <text x="107" y="86" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.5">127-Year Trust • Mahalunge & Hinjewadi</text>
