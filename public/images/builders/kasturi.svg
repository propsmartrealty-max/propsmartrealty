  <text x="108" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#B38B3F" letter-spacing="3.5">HOUSING PUNE</text>
  <text x="108" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#6B7280" letter-spacing="1">The Art of Luxury Living</text>
