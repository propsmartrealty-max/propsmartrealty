  <text x="107" y="69" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#C5161D" letter-spacing="2">SADA SUKHI RAHO</text>
  <text x="107" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">40+ Landmark Communities • Pune & PCMC</text>
