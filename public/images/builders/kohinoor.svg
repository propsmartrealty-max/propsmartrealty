      <stop offset="0%" stop-color="#0E5CAD"/>
      <stop offset="100%" stop-color="#083B70"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

