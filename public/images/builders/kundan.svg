<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">
  <defs>
    <linearGradient id="kundan-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Kundan Gemstone Crest -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="#0F172A"/>
    <!-- Faceted Gemstone -->
    <polygon points="33,14 49,24 43,50 23,50 17,24" fill="none" stroke="url(#kundan-gold)" stroke-width="2"/>
    <polygon points="33,14 43,24 33,50 23,24" fill="url(#kundan-gold)" opacity="0.4"/>
  </g>

  <!-- Typography -->
  <text x="106" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="1.5">KUNDAN</text>
  <text x="107" y="68" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#CA8A04" letter-spacing="3">SPACES • PUNE</text>
  <text x="107" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">Signature Residences • Baner, NIBM & Kondhwa</text>
</svg>
