<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">
  <defs>
    <linearGradient id="tata-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066B2"/>
      <stop offset="100%" stop-color="#004880"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Tata Official Corporate Insignia Emblem -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="66" height="66" rx="14" fill="url(#tata-blue)"/>
    <!-- Official Tata Ellipse & Bifurcated 'T' Insignia -->
    <ellipse cx="33" cy="33" rx="22" ry="17" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 22 25 L 44 25 M 33 25 L 33 42" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
  </g>

  <!-- Typography -->
  <text x="106" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#005A9C" letter-spacing="2.5">TATA</text>
  <text x="107" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1E293B" letter-spacing="3">HOUSING</text>
  <text x="107" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.5">A TATA Enterprise • 150-Year Legacy</text>
</svg>
