<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 110" width="380" height="110">
  <defs>
    <linearGradient id="kalpataru-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007A3D"/>
      <stop offset="100%" stop-color="#005A2B"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="380" height="110" rx="16" fill="#ffffff"/>

  <!-- Kalpataru Tree of Life Medallion -->
  <g transform="translate(25, 22)">
    <!-- Deep Green Shield -->
    <rect x="0" y="0" width="66" height="66" rx="14" fill="url(#kalpataru-green)"/>
    <!-- Sacred Tree of Life Silhouette -->
    <circle cx="33" cy="33" r="23" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <!-- Central Foliage Canopy -->
    <path d="M 33 16 C 26 21 21 28 21 37 C 25 35 29 35 33 37 C 37 35 41 35 45 37 C 45 28 40 21 33 16 Z" fill="#ffffff"/>
    <!-- Tree Trunk & Roots -->
    <path d="M 31 37 L 31 49 L 26 53 L 40 53 L 35 49 L 35 37 Z" fill="#ffffff"/>
    <circle cx="33" cy="27" r="2.5" fill="url(#kalpataru-green)"/>
  </g>

  <!-- Typography -->
  <text x="106" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#006837" letter-spacing="2">KALPATARU</text>
  <text x="107" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155" letter-spacing="3">LIMITED • SINCE 1969</text>
  <text x="107" y="86" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1">Iconic Luxury Landmarks • Baner & Bavdhan</text>
</svg>
