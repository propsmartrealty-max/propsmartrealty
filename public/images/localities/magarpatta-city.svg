<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="sky-magarpatta-city" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001427" />
      <stop offset="45%" stop-color="#143642" />
      <stop offset="85%" stop-color="#0f4c5c" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sun/Moon Glow -->
    <radialGradient id="celestial-magarpatta-city" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb8b24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f4c5c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f4c5c" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Filter -->
    <filter id="glow-magarpatta-city" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bottom Dark Vignette for Text Legibility -->
    <linearGradient id="vignette-magarpatta-city" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="50%" stop-color="#020617" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#020617" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card Accent Glow -->
    <linearGradient id="badge-glow-magarpatta-city" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb8b24" />
      <stop offset="100%" stop-color="#e36414" />
    </linearGradient>
  </defs>

  <!-- 1. Background Sky -->
  <rect width="800" height="1000" fill="url(#sky-magarpatta-city)" />

  <!-- 2. Ambient Celestial Orb / Sun / Moon -->
  <circle cx="640" cy="180" r="160" fill="url(#celestial-magarpatta-city)" />
  <circle cx="640" cy="180" r="42" fill="#ffffff" opacity="0.95" />

  <!-- 3. Starlight / Atmosphere Particles -->
  <circle cx="120" cy="110" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="240" cy="70" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="380" cy="140" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="490" cy="85" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="720" cy="90" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="160" cy="210" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="310" cy="240" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="530" cy="220" r="1" fill="#ffffff" opacity="0.5" />

  <!-- 4. Distant Mountain Skyline Silhouette -->
  <path d="M 0 540 Q 180 430 380 500 T 800 460 L 800 1000 L 0 1000 Z" fill="#040b17" opacity="0.6" />

  <!-- 5. Distant City Skyline Silhouette -->
  <polygon points="40,580 70,580 70,720 40,720" fill="#071324" opacity="0.8" />
  <polygon points="90,520 130,520 130,720 90,720" fill="#071324" opacity="0.8" />
  <polygon points="150,560 190,560 190,720 150,720" fill="#071324" opacity="0.8" />
  <polygon points="470,490 510,490 510,720 470,720" fill="#071324" opacity="0.8" />
  <polygon points="530,530 580,530 580,720 530,720" fill="#071324" opacity="0.8" />
  <polygon points="610,480 660,480 660,720 610,720" fill="#071324" opacity="0.8" />
  <polygon points="680,540 730,540 730,720 680,720" fill="#071324" opacity="0.8" />

  <!-- 6. Special Locality Architectural Elements -->
  
        <!-- Magarpatta Cybercity Iconic Dome & Radial Grid -->
        <circle cx="400" cy="460" r="130" fill="#062633" />
        <path d="M 270 460 A 130 130 0 0 1 530 460" stroke="#fb8b24" stroke-width="4" fill="none" />
        <!-- Dome lattice -->
        <ellipse cx="400" cy="460" rx="90" ry="130" stroke="#e36414" stroke-width="1.5" fill="none" opacity="0.6" />
        <ellipse cx="400" cy="460" rx="50" ry="130" stroke="#e36414" stroke-width="1.5" fill="none" opacity="0.6" />
        <line x1="270" y1="460" x2="530" y2="460" stroke="#fb8b24" stroke-width="2" />
        <circle cx="400" cy="330" r="8" fill="#fb8b24" filter="url(#glow-magarpatta-city)" />
        

  <!-- 7. Foreground Modern High-Rise Buildings -->
  <rect x="520" y="380" width="160" height="420" rx="4" fill="#030816" />
  <line x1="520" y1="380" x2="680" y2="380" stroke="#fb8b24" stroke-width="3" />
  <!-- Illuminated Windows Array -->
  <g fill="#f8f9fa" opacity="0.85">
    <rect x="540" y="410" width="16" height="12" rx="1" />
    <rect x="570" y="410" width="16" height="12" rx="1" />
    <rect x="630" y="410" width="16" height="12" rx="1" />

    <rect x="540" y="440" width="16" height="12" rx="1" />
    <rect x="600" y="440" width="16" height="12" rx="1" />
    <rect x="630" y="440" width="16" height="12" rx="1" />

    <rect x="570" y="470" width="16" height="12" rx="1" />
    <rect x="600" y="470" width="16" height="12" rx="1" />

    <rect x="540" y="500" width="16" height="12" rx="1" />
    <rect x="570" y="500" width="16" height="12" rx="1" />
    <rect x="630" y="500" width="16" height="12" rx="1" />

    <rect x="540" y="540" width="16" height="12" rx="1" />
    <rect x="600" y="540" width="16" height="12" rx="1" />

    <rect x="570" y="580" width="16" height="12" rx="1" />
    <rect x="630" y="580" width="16" height="12" rx="1" />
  </g>

  <!-- Left Foreground Building -->
  <rect x="60" y="460" width="140" height="340" rx="4" fill="#040c1b" />
  <line x1="60" y1="460" x2="200" y2="460" stroke="#e36414" stroke-width="2.5" />
  <g fill="#f8f9fa" opacity="0.75">
    <rect x="80" y="490" width="14" height="10" rx="1" />
    <rect x="110" y="490" width="14" height="10" rx="1" />
    <rect x="150" y="490" width="14" height="10" rx="1" />

    <rect x="80" y="525" width="14" height="10" rx="1" />
    <rect x="150" y="525" width="14" height="10" rx="1" />

    <rect x="110" y="560" width="14" height="10" rx="1" />
    <rect x="150" y="560" width="14" height="10" rx="1" />

    <rect x="80" y="595" width="14" height="10" rx="1" />
    <rect x="110" y="595" width="14" height="10" rx="1" />
  </g>

  <!-- Architectural Rooftop Spire & Antennas -->
  <line x1="600" y1="380" x2="600" y2="280" stroke="#fb8b24" stroke-width="2.5" />
  <circle cx="600" cy="280" r="4" fill="#ff3366" filter="url(#glow-magarpatta-city)" />

  <!-- 8. Subtle Watermark Geometric Emblem -->
  <g transform="translate(680, 60)" opacity="0.35">
    <circle cx="0" cy="0" r="30" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <circle cx="0" cy="0" r="22" stroke="#fb8b24" stroke-width="1" fill="none" />
    <path d="M -12 -12 L 0 -22 L 12 -12 L 0 -2 Z" fill="#fb8b24" />
    <path d="M -12 12 L 0 2 L 12 12 L 0 22 Z" fill="#fb8b24" />
  </g>

  <!-- 9. Modern Diagonal Architectural Aesthetic Accent Line -->
  <line x1="0" y1="720" x2="800" y2="680" stroke="#e36414" stroke-width="1.5" opacity="0.4" />

  <!-- 10. Deep Bottom Vignette Gradient (Ensures clean contrast for overlaid text) -->
  <rect y="400" width="800" height="600" fill="url(#vignette-magarpatta-city)" />

  <!-- 11. Subtle Micro Graphic Locality Tag in Corner -->
  <g transform="translate(48, 890)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#e36414" opacity="0.25" />
    <rect x="0" y="0" width="130" height="26" rx="13" stroke="#fb8b24" stroke-width="1" fill="none" opacity="0.6" />
    <circle cx="14" cy="13" r="4" fill="#fb8b24" />
    <text x="26" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PUNE PRIME</text>
  </g>
</svg>