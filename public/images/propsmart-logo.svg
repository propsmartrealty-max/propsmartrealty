<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none" role="img" aria-label="PROPSMART REALTY">
  <defs>
    <linearGradient id="ps-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="ps-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Modern Architectural Badge Icon -->
  <g transform="translate(4, 4)">
    <rect width="44" height="44" rx="10" fill="url(#ps-icon-grad)" filter="url(#ps-shadow)" />
    <!-- Building Silhouette -->
    <path d="M22 10 L34 20 L30 20 L30 34 L24 34 L24 26 L20 26 L20 34 L14 34 L14 20 L10 20 Z" fill="#FFFFFF" />
    <!-- Accent Diamond -->
    <circle cx="22" cy="18" r="2.5" fill="#F59E0B" />
    <path d="M22 8 L24 10 L22 12 L20 10 Z" fill="#FEF3C7" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(56, 0)">
    <text x="0" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.5px">
      <tspan fill="#0F172A">PROP</tspan>
      <tspan fill="#D97706">SMART</tspan>
    </text>
    <text x="1" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9" letter-spacing="4px" fill="#D97706">
      REALTY
    </text>
  </g>
</svg>