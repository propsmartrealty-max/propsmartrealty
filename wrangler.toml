name = "propsmart-realty"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Production D1 Database
[[d1_databases]]
binding = "DB"
database_name = "propsmart-d1"
database_id = "propsmart-d1-production"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage (Images, Documents, Media)
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "propsmart-assets"

# Environment Variables & Security Settings
[vars]
ENVIRONMENT = "production"
ENABLE_TURNSTILE = "true"
CORS_ALLOW_ORIGIN = "https://propsmartrealty.com,http://localhost:3000,http://localhost:5173"
