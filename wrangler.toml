name = "propsmartrealty"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"
# Cloudflare Pages Build Pipeline Configuration

# Production D1 Database
[[d1_databases]]
binding = "DB"
database_name = "propsmart-d1"
database_id = "71bf05aa-03b7-4db2-8377-6000f5b1151a"
migrations_dir = "migrations"

# Cloudflare Workers KV Namespaces (High-Speed Edge Caching)
[[kv_namespaces]]
binding = "SEO_KV"
id = "669410c9fc60402b8cdf6952288017c1"

[[kv_namespaces]]
binding = "PRICE_KV"
id = "fae686bae1d44dc9a43b13a8eda1513c"

[[kv_namespaces]]
binding = "CRON_KV"
id = "b9f2061da71a4d05af72da2cef15aa7a"

# Cloudflare Workers AI (Serverless LLM on Edge)
[ai]
binding = "AI"

# Cloudflare Vectorize (Semantic Property Search Index)
[[vectorize]]
binding = "VECTORIZE"
index_name = "propsmart-vector-search"

# Cloudflare R2 Object Storage (Uncomment once enabled in Cloudflare Dashboard)
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "propsmart-assets"

# Cloudflare Smart Placement (Auto-optimizes edge compute location for D1 queries)
[placement]
mode = "smart"

# Environment Variables & Security Settings
[vars]
ENVIRONMENT = "production"
ENABLE_TURNSTILE = "true"
CORS_ALLOW_ORIGIN = "https://propsmart.co.in,https://www.propsmart.co.in,https://propsmartrealty.pages.dev,http://localhost:3000,http://localhost:5173"
