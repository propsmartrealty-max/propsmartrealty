name = "propsmartrealty"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"
# Cloudflare Pages Build Pipeline Configuration

# Production D1 Database
[[d1_databases]]
binding = "DB"
database_name = "propsmart-d1"
database_id = "71bf05aa-03b7-4db2-8377-6000f5b1151a"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage (Enable in dashboard to activate)
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "propsmart-assets"

# Cloudflare Smart Placement (Auto-optimizes edge compute location for D1 queries)
[placement]
mode = "smart"

# Environment Variables & Security Settings
[vars]
ENVIRONMENT = "production"
ENABLE_TURNSTILE = "true"
CORS_ALLOW_ORIGIN = "https://propsmart.co.in,https://www.propsmart.co.in,https://propsmartrealty.pages.dev,http://localhost:3000,http://localhost:5173"
